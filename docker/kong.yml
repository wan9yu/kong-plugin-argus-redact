_format_version: "3.0"
_transform: true

services:
  - name: mock-llm
    url: http://mock-llm:8080
    routes:
      - name: chat
        paths:
          - /v1/chat/completions
        strip_path: false
    plugins:
      - name: argus-redact-bridge
        config:
          argus_url: http://argus-redact:8000
          argus_api_key: "${ARGUS_API_KEY}"
          lang: zh
          mode: fast
          profile: pseudonym-llm
          timeout_ms: 5000
          on_error: closed
