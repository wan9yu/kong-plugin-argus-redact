name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  luarocks-upload:
    name: upload rockspec to luarocks.org
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required by softprops/action-gh-release to create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: install luarocks
        run: |
          sudo apt-get update -qq
          # luarocks needs a JSON library and HTTPS bindings to talk to
          # the luarocks.org API; the bare `luarocks` apt package ships
          # neither, so install lua-dkjson and lua-sec alongside.
          sudo apt-get install -y --no-install-recommends \
            luarocks \
            lua-dkjson \
            lua-sec

      - name: derive rockspec from tag
        id: rockspec
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ROCKSPEC="argus-redact-bridge-${VERSION}-1.rockspec"
          if [ ! -f "$ROCKSPEC" ]; then
            echo "ERROR: rockspec '$ROCKSPEC' not found in repo for tag '$GITHUB_REF'." >&2
            echo "Available rockspecs:" >&2
            ls -la *.rockspec >&2 || true
            exit 1
          fi
          echo "Selected rockspec: $ROCKSPEC"
          echo "name=$ROCKSPEC" >> "$GITHUB_OUTPUT"

      - name: lint rockspec
        run: luarocks lint "${{ steps.rockspec.outputs.name }}"

      - name: upload to luarocks.org
        env:
          LUAROCKS_KEY: ${{ secrets.LUAROCKS_KEY }}
        run: |
          if [ -z "${LUAROCKS_KEY:-}" ]; then
            echo "ERROR: LUAROCKS_KEY secret is empty." >&2
            exit 1
          fi
          luarocks upload "${{ steps.rockspec.outputs.name }}" --api-key="$LUAROCKS_KEY"

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            luarocks install argus-redact-bridge
            ```

            ## Reference

            - Configuration, architecture diagram, and `What it doesn't do` are in the [README](https://github.com/wan9yu/kong-plugin-argus-redact#readme).
            - Live integration test record: [`benchmarks/vm-test-2026-05-07.md`](https://github.com/wan9yu/kong-plugin-argus-redact/blob/main/benchmarks/vm-test-2026-05-07.md).
